# =============================================
# Prometheus Configuration for BrightNest Academy
# Scrapes Spring Boot Actuator /actuator/prometheus
# =============================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "brightnest-prod"
    environment: "production"

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - 'alertmanager:9093'

# Load rules once and periodically evaluate them
rule_files:
  - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Spring Boot Application Metrics
  - job_name: "brightnest-spring-boot"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["brightnest-academy:8080"]
        labels:
          app: "brightnest-academy"
          instance: "prod-1"

    # Basic auth if actuator is protected (optional)
    # basic_auth:
    #   username: 'admin'
    #   password: 'secret'

  # Prometheus Self-Monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # MySQL Exporter (if you install one)
  - job_name: "mysql"
    static_configs:
      - targets: ["mysql-exporter:9104"]
        labels:
          database: "brightnest_academy"

  # Node Exporter (system metrics)
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: "ec2-prod-1"

  # Redis Exporter (if using Redis for rate limiting)
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          instance: "redis-prod"

  # Nginx Exporter (optional)
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
