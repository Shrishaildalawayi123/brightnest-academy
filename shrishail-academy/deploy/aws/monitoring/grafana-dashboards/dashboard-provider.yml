# =============================================
# Grafana Dashboard Provisioning Config
# Auto-loads dashboards from this directory
# =============================================

apiVersion: 1

providers:
  - name: 'BrightNest Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
