# =============================================
# Prometheus Alert Rules for BrightNest Academy
# =============================================

groups:
  - name: brightnest_application
    interval: 30s
    rules:
      # Application Down
      - alert: ApplicationDown
        expr: up{job="brightnest-spring-boot"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "BrightNest application is down"
          description: "Application {{ $labels.instance }} has been down for more than 2 minutes"

      # High Error Rate
      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate detected"
          description: "Error rate is {{ $value }} errors/second on {{ $labels.instance }}"

      # High Response Time
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High API response time (p95 > 2s)"
          description: "95th percentile response time is {{ $value }}s on {{ $labels.instance }}"

      # JVM Memory Pressure
      - alert: HighMemoryUsage
        expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "JVM heap memory usage > 85%"
          description: "Heap usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}"

      # Database Connection Pool Exhaustion
      - alert: DatabaseConnectionPoolExhausted
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool near exhaustion"
          description: "{{ $value | humanizePercentage }} of DB connections in use on {{ $labels.instance }}"

  - name: brightnest_infrastructure
    interval: 30s
    rules:
      # High CPU Usage
      - alert: HighCPUUsage
        expr: (100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Server CPU usage > 80%"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}"

      # High Memory Usage
      - alert: HighSystemMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Server memory usage > 85%"
          description: "Memory usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}"

      # Disk Space Low
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space < 15% remaining"
          description: "{{ $labels.mountpoint }} has {{ $value | humanizePercentage }} space remaining on {{ $labels.instance }}"

  - name: brightnest_database
    interval: 30s
    rules:
      # MySQL Down
      - alert: MySQLDown
        expr: mysql_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "MySQL database is down"
          description: "MySQL instance {{ $labels.instance }} is unreachable"

      # Slow Queries
      - alert: MySQLSlowQueries
        expr: rate(mysql_global_status_slow_queries[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High rate of MySQL slow queries"
          description: "{{ $value }} slow queries per second on {{ $labels.instance }}"

      # Connection Limit
      - alert: MySQLConnectionLimitApproaching
        expr: (mysql_global_status_threads_connected / mysql_global_variables_max_connections) > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MySQL connections > 80% of limit"
          description: "{{ $value | humanizePercentage }} of max connections in use on {{ $labels.instance }}"

  - name: brightnest_business
    interval: 1m
    rules:
      # Failed Logins Spike
      - alert: FailedLoginSpike
        expr: rate(authentication_failures_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High rate of failed login attempts"
          description: "{{ $value }} failed logins per second - possible brute force attack"

      # Payment Failures
      - alert: PaymentFailureRateHigh
        expr: (rate(payment_failed_total[10m]) / rate(payment_total[10m])) > 0.1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Payment failure rate > 10%"
          description: "{{ $value | humanizePercentage }} of payments are failing"
