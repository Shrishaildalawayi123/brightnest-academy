# Prometheus Alerting Rules for BrightNest Academy

groups:
  - name: brightnest_application_alerts
    interval: 30s
    rules:
      # High error rate detection
      - alert: HighHTTPErrorRate
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
            sum(rate(http_server_requests_seconds_count[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          component: application
        annotations:
          summary: "High HTTP 5xx error rate detected"
          description: "More than 5% of requests are returning 5xx errors (current: {{ $value | humanizePercentage }})"

      # High response time
      - alert: HighResponseTime
        expr: |
          histogram_quantile(0.95, 
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le)
          ) > 1.0
        for: 5m
        labels:
          severity: warning
          component: application
        annotations:
          summary: "High API response time"
          description: "95th percentile response time is above 1 second (current: {{ $value }}s)"

      # Database connection pool exhaustion
      - alert: DatabaseConnectionPoolNearCapacity
        expr: |
          (hikaricp_connections_active / hikaricp_connections_max) > 0.9
        for: 2m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Database connection pool near capacity"
          description: "Connection pool utilization is above 90% ({{ $value | humanizePercentage }})"

      # JVM memory pressure
      - alert: HighJVMMemoryUsage
        expr: |
          (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 5m
        labels:
          severity: warning
          component: jvm
        annotations:
          summary: "High JVM heap memory usage"
          description: "JVM heap usage is above 85% ({{ $value | humanizePercentage }})"

      # Application down
      - alert: ApplicationDown
        expr: up{job="spring-boot-app"} == 0
        for: 1m
        labels:
          severity: critical
          component: application
        annotations:
          summary: "BrightNest Academy application is down"
          description: "The Spring Boot application has been unreachable for 1 minute"

      # High request rate (potential DDoS)
      - alert: UnusuallyHighRequestRate
        expr: |
          sum(rate(http_server_requests_seconds_count[5m])) > 1000
        for: 5m
        labels:
          severity: warning
          component: security
        annotations:
          summary: "Unusually high request rate"
          description: "Request rate is above 1000 req/s (current: {{ $value }} req/s)"

  - name: brightnest_business_metrics
    interval: 60s
    rules:
      # Failed login attempts spike
      - alert: HighFailedLoginRate
        expr: |
          rate(login_attempts_failed_total[10m]) > 50
        for: 5m
        labels:
          severity: warning
          component: security
        annotations:
          summary: "High failed login attempt rate"
          description: "More than 50 failed logins per minute detected (potential brute force attack)"

      # Enrollment creation failures
      - alert: EnrollmentCreationFailures
        expr: |
          rate(enrollments_failed_total[10m]) > 5
        for: 5m
        labels:
          severity: warning
          component: business
        annotations:
          summary: "High enrollment creation failure rate"
          description: "Enrollment creation is failing at {{ $value }} per minute"
