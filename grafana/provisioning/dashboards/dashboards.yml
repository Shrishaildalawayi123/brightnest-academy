# Grafana Dashboard Provisioning
#Auto-load dashboards from the dashboards directory

apiVersion: 1

providers:
  - name: 'BrightNest Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
