# BrightNest Nginx drop-in for performance and security
# Include this in your primary server block.

# Compression
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

# Connection and buffering optimization
keepalive_timeout 65;
keepalive_requests 1000;
client_body_buffer_size 32k;
client_header_buffer_size 4k;
large_client_header_buffers 4 16k;
proxy_buffering on;
proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;

# Security headers
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-src https://www.google.com https://maps.google.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self';" always;

# Cache HTML briefly so updates still propagate quickly
location ~* \.html$ {
    expires 5m;
    add_header Cache-Control "public, max-age=300" always;
}

# Cache static assets aggressively
location ~* \.(css|js)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    access_log off;
}

location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
    expires 60d;
    add_header Cache-Control "public, max-age=5184000, immutable" always;
    access_log off;
}

location ~* \.(woff|woff2|ttf|otf)$ {
    expires 60d;
    add_header Cache-Control "public, max-age=5184000, immutable" always;
    access_log off;
}

# Force HTTPS for all plain HTTP traffic
server {
  listen 80;
  server_name brightnest-academy.com www.brightnest-academy.com;
  return 301 https://$host$request_uri;
}
