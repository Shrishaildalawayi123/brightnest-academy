# Alertmanager Configuration for BrightNest Academy

global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@brightnest-academy.com'
  smtp_auth_username: 'your-email@gmail.com'
  smtp_auth_password: 'your-app-password'

# Email notification template
templates:
  - '/etc/alertmanager/template/*.tmpl'

# Route configuration
route:
  receiver: 'default-receiver'
  group_by: ['alertname', 'severity', 'component']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 1h

    # Warning alerts - standard notification
    - match:
        severity: warning
      receiver: 'warning-alerts'
      repeat_interval: 6h

# Receivers configuration
receivers:
  - name: 'default-receiver'
    email_configs:
      - to: 'admin@brightnest-academy.com'
        headers:
          Subject: '[BrightNest] Alert: {{ .GroupLabels.alertname }}'

  - name: 'critical-alerts'
    email_configs:
      - to: 'admin@brightnest-academy.com,devops@brightnest-academy.com'
        headers:
          Subject: '🚨 [CRITICAL] BrightNest Alert: {{ .GroupLabels.alertname }}'
    # Optional: Add Slack webhook
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
    #     channel: '#alerts'
    #     title: '🚨 Critical Alert'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}'

  - name: 'warning-alerts'
    email_configs:
      - to: 'monitoring@brightnest-academy.com'
        headers:
          Subject: '⚠️ [WARNING] BrightNest Alert: {{ .GroupLabels.alertname }}'

# Inhibition rules (suppress certain alerts when others fire)
inhibit_rules:
  # If ApplicationDown is firing, suppress other app-related alerts
  - source_match:
      alertname: 'ApplicationDown'
    target_match_re:
      alertname: 'High.*'
    equal: ['job']
