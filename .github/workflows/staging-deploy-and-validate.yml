name: Staging Deploy and SLO Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload compose file to staging server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_DEPLOY_HOST }}
          username: ${{ secrets.STAGING_DEPLOY_USER }}
          key: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          port: ${{ secrets.STAGING_DEPLOY_PORT || 22 }}
          source: "shrishail-academy/deploy/aws/docker-compose.ghcr.yml"
          target: "/opt/brightnest-staging"

      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_DEPLOY_HOST }}
          username: ${{ secrets.STAGING_DEPLOY_USER }}
          key: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          port: ${{ secrets.STAGING_DEPLOY_PORT || 22 }}
          script: |
            set -e
            mkdir -p /opt/brightnest-staging

            if [ -f /opt/brightnest-staging/shrishail-academy/deploy/aws/docker-compose.ghcr.yml ]; then
              mv /opt/brightnest-staging/shrishail-academy/deploy/aws/docker-compose.ghcr.yml /opt/brightnest-staging/docker-compose.yml
              rm -rf /opt/brightnest-staging/shrishail-academy || true
            fi

            cd /opt/brightnest-staging
            docker compose pull
            docker compose up -d

            echo "Staging deployment complete"

  validate-slo-with-k6:
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Validate staging URL secret
        run: |
          if [ -z "${{ secrets.STAGING_BASE_URL }}" ]; then
            echo "STAGING_BASE_URL secret is not set"
            exit 1
          fi

      - name: Smoke test staging
        working-directory: shrishail-academy
        env:
          BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: k6 run --summary-export=smoke-summary.json performance/k6/smoke.js

      - name: Load test staging with SLO thresholds
        working-directory: shrishail-academy
        env:
          BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: k6 run --summary-export=load-summary.json performance/k6/load-staging.js

      - name: Upload k6 summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-k6-summaries
          path: |
            shrishail-academy/smoke-summary.json
            shrishail-academy/load-summary.json
