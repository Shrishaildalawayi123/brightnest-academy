name: Security Scan

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run OWASP Dependency Check
        id: owasp
        continue-on-error: true
        run: >-
          mvn -B org.owasp:dependency-check-maven:check
          -Dformat=HTML,JSON
          -DfailBuildOnCVSS=7.0

      - name: Build image for Trivy scan
        run: docker build -t brightnest-security:${{ github.sha }} .

      - name: Run Trivy (critical fails)
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: brightnest-security:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Run GitLeaks
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports-${{ github.run_id }}
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
            results.sarif
          if-no-files-found: warn

      - name: Create issue for critical findings
        if: ${{ steps.owasp.outcome != 'success' || steps.trivy.outcome != 'success' || steps.gitleaks.outcome != 'success' }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = `Security scan findings (${new Date().toISOString().slice(0,10)})`;
            const body = [
              'Automated security scan detected critical findings.',
              '',
              `- OWASP Dependency Check: ${{ steps.owasp.outcome }}`,
              `- Trivy: ${{ steps.trivy.outcome }}`,
              `- GitLeaks: ${{ steps.gitleaks.outcome }}`,
              '',
              `Workflow run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}`
            ].join('\n');
            await github.rest.issues.create({ owner, repo, title, body, labels: ['security', 'critical'] });

      - name: Fail workflow on critical findings
        if: ${{ steps.owasp.outcome != 'success' || steps.trivy.outcome != 'success' || steps.gitleaks.outcome != 'success' }}
        run: |
          echo "Critical security findings detected."
          exit 1
