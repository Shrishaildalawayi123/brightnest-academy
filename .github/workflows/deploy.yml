name: BrightNest CI/CD Deploy

on:
  push:
    branches: [main]

concurrency:
  group: brightnest-deploy
  cancel-in-progress: true

env:
  APP_NAME: brightnest
  JAR_NAME: shrishail-academy-1.0.0.jar
  DEPLOY_DIR: /home/ubuntu/brightnest-academy

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: brightnest_test
          MYSQL_ROOT_PASSWORD: test
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Test Suite
        run: >
          mvn test
          -Dspring.profiles.active=test
          -Dspring.datasource.url=jdbc:mysql://127.0.0.1:3306/brightnest_test
          -Dspring.datasource.username=root
          -Dspring.datasource.password=test

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 1️⃣ Checkout Repository
        uses: actions/checkout@v4

      - name: 2️⃣ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 3️⃣ Build Spring Boot Application
        run: mvn clean package -DskipTests

      - name: 4️⃣ Verify Build
        run: |
          echo "Listing build artifacts"
          ls -lh target

      - name: 5️⃣ Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: target/${{ env.JAR_NAME }}
          target: ${{ env.DEPLOY_DIR }}/target/
          overwrite: true

      - name: 5.1ï¸âƒ£ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 5.2ï¸âƒ£ Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 5.3ï¸âƒ£ Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/brightnest-academy:latest

      - name: 6️⃣ Upload Nginx Config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/aws/nginx-brightnest.conf
          target: ${{ env.DEPLOY_DIR }}/deploy/aws/
          overwrite: true

      - name: 7️⃣ Deploy Nginx Config and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -u
            DEPLOY_DIR="/home/ubuntu/brightnest-academy"
            NGINX_CONF="$DEPLOY_DIR/deploy/aws/nginx-brightnest.conf"
            CERT_DIR="/etc/letsencrypt/live/brightnest-academy.com"

            echo "=== Pre-deploy diagnostics ==="
            nginx -v 2>&1 || true
            echo "--- sites-available ---"
            sudo ls -la /etc/nginx/sites-available/ 2>/dev/null || echo "directory missing"
            echo "--- sites-enabled ---"
            sudo ls -la /etc/nginx/sites-enabled/ 2>/dev/null || echo "directory missing"
            echo "--- SSL cert directory ---"
            sudo ls -la "$CERT_DIR/" 2>/dev/null || echo "cert dir missing"
            echo "--- nginx service status ---"
            sudo systemctl status nginx --no-pager -l | head -20 || true

            echo "=== SSL certs: ensure valid ==="
            CERT_VALID=false
            if sudo test -f "$CERT_DIR/fullchain.pem" && sudo test -f "$CERT_DIR/privkey.pem"; then
              expiry=$(sudo openssl x509 -in "$CERT_DIR/fullchain.pem" -noout -enddate 2>&1)
              echo "Cert found — $expiry"
              if sudo openssl x509 -checkend 3600 -noout -in "$CERT_DIR/fullchain.pem" 2>/dev/null; then
                echo "Cert is valid (not expiring within 1h)"
                CERT_VALID=true
              else
                echo "WARNING: cert is expired or expiring very soon!"
              fi
              if ! sudo test -f "$CERT_DIR/chain.pem"; then
                echo "chain.pem missing — copying from fullchain.pem"
                sudo cp "$CERT_DIR/fullchain.pem" "$CERT_DIR/chain.pem"
              fi
            fi

            if [ "$CERT_VALID" = "false" ]; then
              echo "=== Creating self-signed certificate fallback ==="
              sudo mkdir -p "$CERT_DIR"
              sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                -keyout "$CERT_DIR/privkey.pem" \
                -out "$CERT_DIR/fullchain.pem" \
                -subj "/C=IN/ST=Karnataka/O=BrightNest Academy/CN=brightnest-academy.com" 2>&1 || true
              sudo cp "$CERT_DIR/fullchain.pem" "$CERT_DIR/chain.pem"
              echo "Self-signed cert created"
            fi

            echo "=== Clearing sites-enabled (remove all for clean install) ==="
            sudo find /etc/nginx/sites-enabled/ -maxdepth 1 \( -type l -o -type f \) -delete 2>/dev/null || true

            echo "=== Installing nginx config ==="
            sudo cp "$NGINX_CONF" /etc/nginx/sites-available/brightnest-academy
            sudo ln -sf /etc/nginx/sites-available/brightnest-academy /etc/nginx/sites-enabled/brightnest-academy
            echo "Installed: $(sudo ls -la /etc/nginx/sites-enabled/)"

            echo "=== Nginx config test ==="
            if sudo nginx -t 2>&1; then
              echo "Config test PASSED"
            else
              echo "Config test FAILED — full nginx error:"
              sudo nginx -T 2>&1 | grep -E "error|emerg|warn|nginx -t" | head -40 || true
              exit 1
            fi

            echo "=== Starting/restarting nginx ==="
            sudo systemctl enable nginx
            if sudo systemctl restart nginx; then
              echo "Nginx started: $(sudo systemctl is-active nginx)"
            else
              echo "Nginx restart FAILED — journal:"
              sudo journalctl -u nginx --lines=30 --no-pager 2>/dev/null || true
              exit 1
            fi

            echo "=== Local connectivity check ==="
            sleep 2
            echo "-- HTTP (should redirect) --"
            curl -sSI -H "Host: brightnest-academy.com" http://127.0.0.1/ | head -5 || true
            echo "-- HTTPS root (should be 302 https) --"
            curl -skSI -H "Host: brightnest-academy.com" https://127.0.0.1/ | head -10 || true

      - name: 8️⃣ Restart Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/brightnest-academy
            echo "Restarting application service"
            sudo systemctl restart brightnest
            sudo systemctl status brightnest --no-pager

      - name: 9️⃣ Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Checking application health"
            for i in {1..15}; do
              if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
                echo "Application started successfully"
                exit 0
              fi
              echo "Waiting for app startup..."
              sleep 5
            done
            echo "Application failed to start"
            exit 1
