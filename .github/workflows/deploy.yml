name: BrightNest Auto Deploy

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven

      - name: Build Project
        run: mvn clean package -DskipTests

      - name: Prepare EC2 target directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            mkdir -p "${{ secrets.EC2_PATH }}/target"

      - name: Upload built JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: ${{ secrets.EC2_PATH }}/target

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.EC2_PATH }} || exit 1

            # Pull cleanly so deploy fails fast on branch divergence
            git fetch origin main
            git reset --hard origin/main

            # Apply idempotent schema additions required by newly introduced entities
            # when production is running with ddl-auto=validate.
            if [ -f .env ]; then
              set -a
              # shellcheck disable=SC1091
              . ./.env
              set +a
            fi

            if [ -f database/add-marketing-features.sql ] && command -v mysql >/dev/null 2>&1; then
              if [ -n "${DB_USER:-}" ] && [ -n "${DB_PASS:-}" ]; then
                export MYSQL_PWD="${DB_PASS}"
                DB_TARGET="${DB_NAME:-}"

                if [ -z "${DB_TARGET}" ]; then
                  if mysql -Nse "SHOW DATABASES LIKE 'brightnest_academy'" \
                    -h "${DB_HOST:-127.0.0.1}" \
                    -P "${DB_PORT:-3306}" \
                    -u "${DB_USER}" | grep -q brightnest_academy; then
                    DB_TARGET="brightnest_academy"
                  elif mysql -Nse "SHOW DATABASES LIKE 'brightnest'" \
                    -h "${DB_HOST:-127.0.0.1}" \
                    -P "${DB_PORT:-3306}" \
                    -u "${DB_USER}" | grep -q brightnest; then
                    DB_TARGET="brightnest"
                  fi
                fi

                if [ -n "${DB_TARGET}" ]; then
                  if ! mysql \
                    -h "${DB_HOST:-127.0.0.1}" \
                    -P "${DB_PORT:-3306}" \
                    -u "${DB_USER}" \
                    "${DB_TARGET}" \
                    < database/add-marketing-features.sql; then
                    echo "WARNING: marketing schema migration failed; continuing with deploy" >&2
                  fi
                else
                  echo "WARNING: could not determine DB name for migration; continuing with deploy" >&2
                fi

                unset MYSQL_PWD
              else
                echo "Skipping DB migration: DB_USER/DB_PASS are not set in deploy environment" >&2
              fi
            fi

            # Restart app and validate health before finishing pipeline
            sudo systemctl restart brightnest
            sudo systemctl is-active --quiet brightnest

            for i in $(seq 1 60); do
              if curl -fsS --max-time 4 http://127.0.0.1:8080/health >/dev/null; then
                echo "Health check passed on attempt ${i}"
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed after restart" >&2
            sudo systemctl status brightnest --no-pager >&2 || true
            sudo journalctl -u brightnest -n 120 --no-pager >&2 || true
            sudo tail -n 120 /var/log/nginx/error.log >&2 || true
            exit 1
