name: BrightNest Auto Deploy

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven

      - name: Build Project
        run: mvn clean package -DskipTests

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.EC2_PATH }} || exit 1

            # Pull cleanly so deploy fails fast on branch divergence
            git fetch origin main
            git reset --hard origin/main

            # Build with bounded memory to reduce OOM risk on small EC2 instances
            export MAVEN_OPTS="-Xms256m -Xmx768m"
            mvn -B -DskipTests clean package

            # Apply idempotent schema additions required by newly introduced entities
            # when production is running with ddl-auto=validate.
            if [ -f .env ]; then
              set -a
              # shellcheck disable=SC1091
              . ./.env
              set +a
            fi

            if [ -f database/add-marketing-features.sql ] && command -v mysql >/dev/null 2>&1; then
              if [ -n "${DB_USER:-}" ] && [ -n "${DB_PASS:-}" ]; then
                export MYSQL_PWD="${DB_PASS}"
                mysql \
                  -h "${DB_HOST:-127.0.0.1}" \
                  -P "${DB_PORT:-3306}" \
                  -u "${DB_USER}" \
                  "${DB_NAME:-brightnest}" \
                  < database/add-marketing-features.sql
                unset MYSQL_PWD
              else
                echo "Skipping DB migration: DB_USER/DB_PASS are not set in deploy environment" >&2
              fi
            fi

            # Restart app and validate health before finishing pipeline
            sudo systemctl restart brightnest
            sudo systemctl is-active --quiet brightnest

            for i in $(seq 1 60); do
              if curl -fsS --max-time 4 http://127.0.0.1:8080/health >/dev/null; then
                echo "Health check passed on attempt ${i}"
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed after restart" >&2
            sudo systemctl status brightnest --no-pager >&2 || true
            sudo journalctl -u brightnest -n 120 --no-pager >&2 || true
            sudo tail -n 120 /var/log/nginx/error.log >&2 || true
            exit 1
