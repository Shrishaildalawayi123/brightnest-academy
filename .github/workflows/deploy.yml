name: Deploy Spring Boot to EC2

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  APP_JAR: target/shrishail-academy-1.0.0.jar
  DEPLOY_DIR: /home/ubuntu/brightnest-academy
  SERVICE_NAME: brightnest
  DEPLOY_USER: ${{ secrets.EC2_USERNAME != '' && secrets.EC2_USERNAME || secrets.EC2_USER }}

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Stage 1 - Checkout
        uses: actions/checkout@v4

      - name: Stage 2 - Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Stage 3 - Build application
        run: mvn -B clean package -DskipTests

      - name: Stage 4 - Verify build outputs
        run: ls -lah target

      - name: Stage 5 - Verify JAR exists
        run: |
          if [ ! -f "$APP_JAR" ]; then
            echo "Expected JAR missing: $APP_JAR" >&2
            exit 1
          fi

      - name: Stage 6 - Validate deployment configuration
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "Missing required secret: EC2_HOST" >&2
            exit 1
          fi

          if [ -z "$DEPLOY_USER" ]; then
            echo "Missing required secret: EC2_USERNAME" >&2
            echo "Legacy fallback EC2_USER is also not set" >&2
            exit 1
          fi

          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "Missing required secret: EC2_SSH_KEY" >&2
            exit 1
          fi

          echo "EC2 deployment configuration validated"
          echo "Deploy target: $DEPLOY_DIR"
          echo "Deploy user: $DEPLOY_USER"

      - name: Stage 7 - Prepare remote deployment directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 30s
          script: |
            set -euo pipefail
            install -d -m 755 "/home/ubuntu/brightnest-academy"
            test -d "/home/ubuntu/brightnest-academy"
            test -w "/home/ubuntu/brightnest-academy"

      - name: Stage 8 - Upload artifact to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ${{ env.APP_JAR }}
          target: ${{ env.DEPLOY_DIR }}/
          strip_components: 1
          timeout: 60s
          overwrite: true

      - name: Stage 9 - Restart application service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 60s
          script: |
            set -euo pipefail
            cd "/home/ubuntu/brightnest-academy"
            ls -lah
            test -f "shrishail-academy-1.0.0.jar"
            sudo systemctl stop "brightnest"
            sudo systemctl start "brightnest"
            sudo systemctl status "brightnest" --no-pager

      - name: Stage 10 - Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 30s
          script: |
            set -euo pipefail
            for i in $(seq 1 30); do
              if curl -fsS --max-time 5 http://localhost:8080/health >/dev/null; then
                echo "Health endpoint is ready on attempt $i"
                exit 0
              fi

              if curl -fsS --max-time 5 http://localhost:8080/actuator/health >/dev/null; then
                echo "Actuator health endpoint is ready on attempt $i"
                exit 0
              fi

              if curl -fsS --max-time 5 http://localhost:8080 >/dev/null; then
                echo "App root endpoint is ready on attempt $i"
                exit 0
              fi

              echo "Health check attempt $i/30 failed; retrying in 5s"
              sleep 5
            done

            echo "Application did not become healthy in expected time" >&2
            exit 1

      - name: Stage 11 - Debug deployment logs
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 60s
          script: |
            set +e
            echo "Listing deployment directory"
            ls -lah "/home/ubuntu/brightnest-academy"
            echo "Systemd service status"
            sudo systemctl status "brightnest" --no-pager
            echo "Recent service logs"
            sudo journalctl -u "brightnest" -n 200 --no-pager
