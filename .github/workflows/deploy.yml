name: BrightNest CI/CD Deploy

on:
  push:
    branches: [main]

concurrency:
  group: brightnest-deploy
  cancel-in-progress: true

env:
  APP_NAME: brightnest
  JAR_NAME: shrishail-academy-1.0.0.jar
  DEPLOY_DIR: /home/ubuntu/brightnest-academy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1️⃣ Checkout Repository
        uses: actions/checkout@v4

      - name: 2️⃣ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 3️⃣ Build Spring Boot Application
        run: mvn clean package -DskipTests

      - name: 4️⃣ Verify Build
        run: |
          echo "Listing build artifacts"
          ls -lh target

      - name: 5️⃣ Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: target/${{ env.JAR_NAME }}
          target: ${{ env.DEPLOY_DIR }}/target/
          overwrite: true

      - name: 6️⃣ Upload Nginx Config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/aws/nginx-brightnest.conf
          target: ${{ env.DEPLOY_DIR }}/deploy/aws/
          overwrite: true

      - name: 7️⃣ Apply Nginx Config And Reload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            SRC="${{ env.DEPLOY_DIR }}/deploy/aws/nginx-brightnest.conf"
            if [ ! -f "$SRC" ]; then
              echo "Missing source nginx config: $SRC"
              exit 1
            fi

            ACTIVE_FILE=$(sudo grep -Rsl "server_name .*brightnest-academy.com" /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -n 1 || true)
            if [ -z "$ACTIVE_FILE" ]; then
              if [ -f /etc/nginx/sites-available/brightnest-academy ]; then
                ACTIVE_FILE=/etc/nginx/sites-available/brightnest-academy
              elif [ -f /etc/nginx/sites-available/brightnest ]; then
                ACTIVE_FILE=/etc/nginx/sites-available/brightnest
              else
                ACTIVE_FILE=/etc/nginx/sites-available/brightnest-academy
                sudo touch "$ACTIVE_FILE"
              fi
            fi

            echo "Applying nginx config to: $ACTIVE_FILE"
            sudo cp "$ACTIVE_FILE" "${ACTIVE_FILE}.bak.$(date +%Y%m%d%H%M%S)" || true
            sudo cp "$SRC" "$ACTIVE_FILE"

            case "$ACTIVE_FILE" in
              /etc/nginx/sites-available/*)
                ENABLED_LINK="/etc/nginx/sites-enabled/$(basename "$ACTIVE_FILE")"
                if [ ! -e "$ENABLED_LINK" ]; then
                  sudo ln -s "$ACTIVE_FILE" "$ENABLED_LINK"
                fi
                ;;
            esac

            sudo nginx -t
            sudo systemctl reload nginx
            sudo systemctl --no-pager --full status nginx | sed -n '1,20p'

      - name: 8️⃣ Restart Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/brightnest-academy
            echo "Restarting application service"
            sudo systemctl restart brightnest
            sudo systemctl status brightnest --no-pager

      - name: 9️⃣ Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Checking application health"
            for i in {1..15}; do
              if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
                echo "Application started successfully"
                exit 0
              fi
              echo "Waiting for app startup..."
              sleep 5
            done
            echo "Application failed to start"
            exit 1
