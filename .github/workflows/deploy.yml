name: BrightNest CI/CD Deploy

on:
  push:
    branches: [main]

concurrency:
  group: brightnest-deploy
  cancel-in-progress: true

env:
  APP_NAME: brightnest
  JAR_NAME: shrishail-academy-1.0.0.jar
  DEPLOY_DIR: /home/ubuntu/brightnest-academy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1️⃣ Checkout Repository
        uses: actions/checkout@v4

      - name: 2️⃣ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 3️⃣ Build Spring Boot Application
        run: mvn clean package -DskipTests

      - name: 4️⃣ Verify Build
        run: |
          echo "Listing build artifacts"
          ls -lh target

      - name: 5️⃣ Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: target/${{ env.JAR_NAME }}
          target: ${{ env.DEPLOY_DIR }}/target/
          overwrite: true

      - name: 6️⃣ Upload Nginx Config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/aws/nginx-brightnest.conf
          target: ${{ env.DEPLOY_DIR }}/deploy/aws/
          overwrite: true

      - name: 7️⃣ Audit Active Nginx Config And Apply Root Redirect Fix
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -u
            TS=$(date +%Y%m%d%H%M%S)
            AUDIT_FILE="/tmp/nginx-audit-${TS}.log"
            PATCHED_LIST="/tmp/nginx-patched-${TS}.list"
            : > "$PATCHED_LIST"

            echo "=== Nginx Runtime Audit: Version ==="
            sudo nginx -v 2>&1 || true

            echo "=== Nginx Runtime Audit: Full Config (nginx -T) ==="
            sudo nginx -T > "$AUDIT_FILE" 2>&1 || true
            sudo sed -n '1,120p' "$AUDIT_FILE"

            ACTIVE_FILE=$(awk '
              /^# configuration file / {
                file=$4;
                sub(/:$/, "", file);
              }
              /server_name[[:space:]]+.*brightnest-academy\.com/ {
                print file;
                exit;
              }
            ' "$AUDIT_FILE")

            CANDIDATES=""
            if [ -n "${ACTIVE_FILE}" ] && [ -f "${ACTIVE_FILE}" ]; then
              CANDIDATES="${ACTIVE_FILE}"
            fi

            DISCOVERED=$(sudo grep -Rsl "server_name .*brightnest-academy.com" /etc/nginx/sites-enabled /etc/nginx/conf.d /etc/nginx/sites-available 2>/dev/null || true)
            if [ -n "$DISCOVERED" ]; then
              CANDIDATES="${CANDIDATES}
${DISCOVERED}"
            fi

            for fallback in /etc/nginx/sites-enabled/default /etc/nginx/sites-available/default /etc/nginx/sites-enabled/brightnest /etc/nginx/sites-available/brightnest /etc/nginx/sites-enabled/brightnest-academy /etc/nginx/sites-available/brightnest-academy; do
              if [ -f "$fallback" ]; then
                CANDIDATES="${CANDIDATES}
${fallback}"
              fi
            done

            echo "=== Candidate server files ==="
            echo "$CANDIDATES" | tr ' ' '\n' | sed '/^$/d' | sort -u

            echo "=== Redirect directives in active server file (before) ==="
            echo "$CANDIDATES" | tr ' ' '\n' | sed '/^$/d' | sort -u | while read -r f; do
              if [ -f "$f" ]; then
                echo "--- $f ---"
                sudo nl -ba "$f" | grep -E "server_name|location = /|return 30[12]|proxy_redirect" || true
              fi
            done

            echo "=== Origin check: direct local HTTP/HTTPS via nginx ==="
            echo "-- HTTP 127.0.0.1 with Host header --"
            curl -sSI -H "Host: brightnest-academy.com" http://127.0.0.1/ | sed -n '1,10p' || true
            echo "-- HTTPS 127.0.0.1 with Host header --"
            curl -skSI -H "Host: brightnest-academy.com" https://127.0.0.1/ | sed -n '1,10p' || true

            echo "$CANDIDATES" | tr ' ' '\n' | sed '/^$/d' | sort -u | while read -r f; do
              if [ ! -f "$f" ]; then
                continue
              fi
              BACKUP_FILE="${f}.bak.${TS}"
              sudo cp "$f" "$BACKUP_FILE" || true

              before_hash=$(sudo sha256sum "$f" | awk '{print $1}')
              sudo sed -i 's|return 302 /index.html;|return 302 https://$host/index.html;|g' "$f"
              sudo sed -i 's|return 302 http://brightnest-academy.com/index.html;|return 302 https://$host/index.html;|g' "$f"
              after_hash=$(sudo sha256sum "$f" | awk '{print $1}')

              if [ "$before_hash" != "$after_hash" ]; then
                echo "$f" | sudo tee -a "$PATCHED_LIST" >/dev/null
              fi
            done

            if sudo nginx -t; then
              sudo systemctl reload nginx
              echo "Nginx reloaded after candidate patching"
            else
              echo "Nginx validation failed after patching. Restoring backups."
              while read -r f; do
                [ -z "$f" ] && continue
                b="${f}.bak.${TS}"
                if [ -f "$b" ]; then
                  sudo cp "$b" "$f"
                fi
              done < <(echo "$CANDIDATES" | tr ' ' '\n' | sed '/^$/d' | sort -u)
              sudo nginx -t || true
              sudo systemctl reload nginx || true
              echo "Proceeding with app deploy after nginx restore"
            fi

            echo "=== Redirect directives in active server file (after) ==="
            echo "$CANDIDATES" | tr ' ' '\n' | sed '/^$/d' | sort -u | while read -r f; do
              if [ -f "$f" ]; then
                echo "--- $f ---"
                sudo nl -ba "$f" | grep -E "server_name|location = /|return 30[12]|proxy_redirect" || true
              fi
            done

            echo "=== Files actually patched ==="
            if [ -s "$PATCHED_LIST" ]; then
              sudo cat "$PATCHED_LIST"
            else
              echo "No redirect rewrites were required"
            fi

            echo "=== Post-reload local check ==="
            curl -skSI -H "Host: brightnest-academy.com" https://127.0.0.1/ | sed -n '1,12p' || true

      - name: 8️⃣ Restart Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/brightnest-academy
            echo "Restarting application service"
            sudo systemctl restart brightnest
            sudo systemctl status brightnest --no-pager

      - name: 9️⃣ Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Checking application health"
            for i in {1..15}; do
              if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
                echo "Application started successfully"
                exit 0
              fi
              echo "Waiting for app startup..."
              sleep 5
            done
            echo "Application failed to start"
            exit 1
