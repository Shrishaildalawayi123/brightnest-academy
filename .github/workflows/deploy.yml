name: BrightNest CI/CD Deploy

on:
  push:
    branches: [main]

concurrency:
  group: brightnest-deploy
  cancel-in-progress: true

env:
  APP_NAME: brightnest
  JAR_NAME: shrishail-academy-1.0.0.jar
  DEPLOY_DIR: /home/ubuntu/brightnest-academy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1️⃣ Checkout Repository
        uses: actions/checkout@v4

      - name: 2️⃣ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 3️⃣ Build Spring Boot Application
        run: mvn clean package -DskipTests

      - name: 4️⃣ Verify Build
        run: |
          echo "Listing build artifacts"
          ls -lh target

      - name: 5️⃣ Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: target/${{ env.JAR_NAME }}
          target: ${{ env.DEPLOY_DIR }}/target/
          overwrite: true

      - name: 6️⃣ Upload Nginx Config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/aws/nginx-brightnest.conf
          target: ${{ env.DEPLOY_DIR }}/deploy/aws/
          overwrite: true

      - name: 7️⃣ Deploy Nginx Config and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            DEPLOY_DIR="/home/ubuntu/brightnest-academy"
            NGINX_CONF="$DEPLOY_DIR/deploy/aws/nginx-brightnest.conf"

            echo "=== SSL Certificate Status ==="
            if [ -f /etc/letsencrypt/live/brightnest-academy.com/fullchain.pem ]; then
              sudo openssl x509 -in /etc/letsencrypt/live/brightnest-academy.com/fullchain.pem -noout -dates 2>&1 || true
            else
              echo "WARNING: SSL cert not found at expected path!"
              echo "Searching for certs..."
              sudo find /etc/letsencrypt -name "fullchain.pem" 2>/dev/null || true
            fi

            echo "=== Installing Nginx Config ==="
            sudo cp "$NGINX_CONF" /etc/nginx/sites-available/brightnest-academy
            sudo ln -sf /etc/nginx/sites-available/brightnest-academy /etc/nginx/sites-enabled/brightnest-academy
            echo "Config installed to sites-available/brightnest-academy"

            echo "=== Removing conflicting default site ==="
            if [ -f /etc/nginx/sites-enabled/default ]; then
              sudo rm -f /etc/nginx/sites-enabled/default
              echo "Default site removed"
            fi

            echo "=== Nginx config test ==="
            sudo nginx -t 2>&1

            echo "=== Starting/restarting Nginx ==="
            sudo systemctl enable nginx
            sudo systemctl restart nginx
            echo "Nginx status: $(sudo systemctl is-active nginx)"

            echo "=== Local connectivity check ==="
            sleep 2
            echo "-- HTTP (should redirect to HTTPS) --"
            curl -sSI -H "Host: brightnest-academy.com" http://127.0.0.1/ | head -5 || true
            echo "-- HTTPS root (should be 302 to https://.../index.html) --"
            curl -skSI -H "Host: brightnest-academy.com" https://127.0.0.1/ | head -10 || true

      - name: 8️⃣ Restart Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/brightnest-academy
            echo "Restarting application service"
            sudo systemctl restart brightnest
            sudo systemctl status brightnest --no-pager

      - name: 9️⃣ Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Checking application health"
            for i in {1..15}; do
              if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
                echo "Application started successfully"
                exit 0
              fi
              echo "Waiting for app startup..."
              sleep 5
            done
            echo "Application failed to start"
            exit 1
