name: Deploy Spring Boot to EC2

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  APP_JAR: target/shrishail-academy-1.0.0.jar
  DEPLOY_DIR: /home/ubuntu/brightnest-academy
  SERVICE_NAME: brightnest

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Stage 1 - Checkout
        uses: actions/checkout@v4

      - name: Stage 2 - Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Stage 3 - Build application
        run: mvn -B clean package -DskipTests

      - name: Stage 4 - Verify build outputs
        run: ls -lah target

      - name: Stage 5 - Verify JAR exists
        run: |
          if [ ! -f "$APP_JAR" ]; then
            echo "Expected JAR missing: $APP_JAR" >&2
            exit 1
          fi

      - name: Stage 6 - Upload artifact to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ${{ env.APP_JAR }}
          target: ${{ env.DEPLOY_DIR }}/

      - name: Stage 7 - Restart application service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "/home/ubuntu/brightnest-academy"
            ls -lah
            sudo systemctl stop "brightnest"
            sudo systemctl start "brightnest"
            sudo systemctl status "brightnest" --no-pager

      - name: Stage 8 - Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            curl -I http://localhost:8080

      - name: Stage 9 - Debug deployment logs
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set +e
            echo "Listing deployment directory"
            ls -lah "/home/ubuntu/brightnest-academy"
            echo "Systemd service status"
            sudo systemctl status "brightnest" --no-pager
            echo "Recent service logs"
            sudo journalctl -u "brightnest" -n 200 --no-pager
