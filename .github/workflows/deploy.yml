name: Release Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag override (default: commit SHA)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  APP_NAME: brightnest
  PROD_PORT: "8080"
  BLUE_PORT: "18080"
  GREEN_PORT: "18081"

jobs:
  quality-gates:
    name: Quality and Security Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests and coverage gate
        run: >-
          mvn -B clean verify
          -Dspring.profiles.active=test
          -Djacoco.minimum.coverage=0.55

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: qa/package-lock.json

      - name: Run frontend unit tests
        run: |
          npm ci --prefix qa
          npm run --prefix qa test:unit

      - name: Enforce dependency CVE threshold (OWASP)
        if: ${{ secrets.NVD_API_KEY != '' }}
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
            -Dformat=JSON \
            -DfailBuildOnCVSS=7.0 \
            -DnvdApiKey=${{ secrets.NVD_API_KEY }}

      - name: Enforce dependency CVE threshold (Trivy fallback)
        if: ${{ secrets.NVD_API_KEY == '' }}
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-artifacts-${{ github.sha }}
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
            target/site/jacoco/**
            target/dependency-check-report.json
          if-no-files-found: warn

  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: quality-gates
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: meta
        run: |
          TAG_INPUT="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG_INPUT" ]; then
            TAG_INPUT="${{ github.sha }}"
          fi
          IMAGE_REF="ghcr.io/${{ github.repository_owner }}/brightnest-academy:${TAG_INPUT}"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Build and push immutable and latest tags
        run: |
          IMAGE_REF="${{ steps.meta.outputs.image_ref }}"
          docker build -t "$IMAGE_REF" -t "ghcr.io/${{ github.repository_owner }}/brightnest-academy:latest" .
          docker push "$IMAGE_REF"
          docker push "ghcr.io/${{ github.repository_owner }}/brightnest-academy:latest"

      - name: Scan pushed image with Trivy (critical fails)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.meta.outputs.image_ref }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy-production:
    name: Deploy to Production (Blue-Green)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Deploy candidate on inactive slot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            IMAGE="${{ needs.build-and-push.outputs.image_ref }}"
            APP_NAME="${{ env.APP_NAME }}"
            PROD_PORT="${{ env.PROD_PORT }}"
            BLUE_PORT="${{ env.BLUE_PORT }}"
            GREEN_PORT="${{ env.GREEN_PORT }}"

            ACTIVE_SLOT="blue"
            if docker ps --format '{{.Names}}' | grep -q "^${APP_NAME}-green$"; then
              GREEN_PORT_LIVE=$(docker inspect -f '{{range .NetworkSettings.Ports}}{{(index . 0).HostPort}}{{end}}' "${APP_NAME}-green" 2>/dev/null || true)
              if [ "$GREEN_PORT_LIVE" = "$PROD_PORT" ]; then
                ACTIVE_SLOT="green"
              fi
            fi

            if [ "$ACTIVE_SLOT" = "blue" ]; then
              CANDIDATE_SLOT="green"
              CANDIDATE_PORT="$GREEN_PORT"
              ACTIVE_CONTAINER="${APP_NAME}-blue"
            else
              CANDIDATE_SLOT="blue"
              CANDIDATE_PORT="$BLUE_PORT"
              ACTIVE_CONTAINER="${APP_NAME}-green"
            fi

            CANDIDATE_CONTAINER="${APP_NAME}-${CANDIDATE_SLOT}"

            echo "Active slot: $ACTIVE_SLOT"
            echo "Candidate slot: $CANDIDATE_SLOT"
            echo "Deploying image: $IMAGE"

            docker pull "$IMAGE"
            docker rm -f "$CANDIDATE_CONTAINER" || true

            docker run -d \
              --name "$CANDIDATE_CONTAINER" \
              --restart unless-stopped \
              -p "${CANDIDATE_PORT}:8080" \
              -e SPRING_PROFILES_ACTIVE=prod \
              "$IMAGE"

            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${CANDIDATE_PORT}/health" >/dev/null; then
                echo "Candidate container healthy"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Candidate health check failed"
                docker logs "$CANDIDATE_CONTAINER" --tail 150 || true
                exit 1
              fi
              sleep 4
            done

            TMP_CONF="/tmp/${APP_NAME}.conf"
            sudo cp /etc/nginx/sites-available/brightnest-academy "$TMP_CONF"
            sudo sed -i -E "s/(proxy_pass\s+http:\/\/127\.0\.0\.1:)[0-9]+/\1${CANDIDATE_PORT}/g" "$TMP_CONF"
            sudo cp "$TMP_CONF" /etc/nginx/sites-available/brightnest-academy
            sudo nginx -t
            sudo systemctl reload nginx

            for i in $(seq 1 20); do
              if curl -fsS "http://127.0.0.1:${PROD_PORT}/health" >/dev/null; then
                echo "Production endpoint healthy after switch"
                break
              fi
              if [ "$i" -eq 20 ]; then
                echo "Production health failed after switch, rolling back nginx"
                sudo sed -i -E "s/(proxy_pass\s+http:\/\/127\.0\.0\.1:)[0-9]+/\1$( [ \"$ACTIVE_SLOT\" = \"blue\" ] && echo $BLUE_PORT || echo $GREEN_PORT )/g" /etc/nginx/sites-available/brightnest-academy
                sudo nginx -t
                sudo systemctl reload nginx
                docker rm -f "$CANDIDATE_CONTAINER" || true
                exit 1
              fi
              sleep 3
            done

            if [ -n "$ACTIVE_CONTAINER" ]; then
              docker rm -f "$ACTIVE_CONTAINER" || true
            fi

            echo "Deployment complete. Active slot is now: $CANDIDATE_SLOT"

      - name: Final health verification on production port
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            curl -fsS "http://127.0.0.1:${{ env.PROD_PORT }}/health" >/dev/null
            echo "Final health check passed"
