name: BrightNest CI/CD Deploy

on:
  push:
    branches: [ main ]

concurrency:
  group: brightnest-deploy
  cancel-in-progress: true

env:
  APP_NAME: brightnest
  JAR_NAME: shrishail-academy-1.0.0.jar
  DEPLOY_DIR: /home/ubuntu/brightnest-academy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: 1️⃣ Checkout Repository
        uses: actions/checkout@v4

      - name: 2️⃣ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 3️⃣ Build Spring Boot Application
        run: mvn clean package -DskipTests

      - name: 4️⃣ Verify Build
        run: |
          echo "Listing build artifacts"
          ls -lh target

      - name: 5️⃣ Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: target/${{ env.JAR_NAME }}
          target: ${{ env.DEPLOY_DIR }}/target/
          overwrite: true

      - name: 6️⃣ Restart Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/brightnest-academy
            echo "Restarting application service"
            sudo systemctl restart brightnest
            sudo systemctl status brightnest --no-pager

      - name: 7️⃣ Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Checking application health"
            for i in {1..15}; do
              if curl -f http://localhost:8080 >/dev/null 2>&1; then
                echo "Application started successfully"
                exit 0
              fi
              echo "Waiting for app startup..."
              sleep 5
            done
            echo "Application failed to start"
            exit 1
