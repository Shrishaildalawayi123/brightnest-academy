name: Release Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  quality-gates:
    name: Quality and Security Gates
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test release transactions and environment validation
        run: |
          python3 -m unittest discover -s deploy/aws/tests -v
          bash -n deploy/aws/scripts/release-blue-green.sh
          shellcheck deploy/aws/scripts/release-blue-green.sh

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests and coverage gate
        run: >-
          mvn -B clean verify
          -Dspring.profiles.active=test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: qa/package-lock.json

      - name: Run frontend unit tests
        run: |
          npm ci --prefix qa
          npm run --prefix qa test:unit

      - name: Enforce dependency CVE threshold
        run: >-
          mvn -B org.owasp:dependency-check-maven:check
          -Dformat=JSON
          -DfailBuildOnCVSS=7.0

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-artifacts-${{ github.sha }}
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
            target/site/jacoco/**
            target/dependency-check-report.json
          if-no-files-found: warn

  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: quality-gates
    outputs:
      image_ref: ${{ steps.immutable.outputs.image_ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase image repository
        id: meta
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "repository=ghcr.io/${OWNER}/brightnest-academy" >> "$GITHUB_OUTPUT"

      - name: Build and push candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.repository }}:${{ github.sha }}
          build-args: RELEASE_REVISION=${{ github.sha }}

      - name: Resolve immutable image
        id: immutable
        env:
          REPOSITORY: ${{ steps.meta.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image_ref=${REPOSITORY}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Scan pushed image with Trivy (critical fails)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.immutable.outputs.image_ref }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy-production:
    name: Deploy to Production (Blue-Green)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Copy release tools to a commit-specific directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/aws/scripts/release-blue-green.sh,deploy/aws/scripts/validate-release-env.py
          target: /opt/brightnest/releases/${{ github.sha }}

      - name: Deploy scanned digest and verify HTTPS traffic
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_IMAGE: ${{ needs.build-and-push.outputs.image_ref }}
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: RELEASE_IMAGE,RELEASE_SHA
          script: |
            set -eu
            bash "/opt/brightnest/releases/${RELEASE_SHA}/deploy/aws/scripts/release-blue-green.sh" \
              deploy "$RELEASE_IMAGE" "$RELEASE_SHA"
