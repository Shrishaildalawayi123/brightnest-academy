name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: shrishail_academy
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests (Spring Boot)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: shrishail_academy
          DB_USER: root
          DB_PASS: testroot
          JWT_SECRET: CI-Test-Secret-Key-Must-Be-At-Least-64-Characters-Long-For-HS512-Algorithm!!
          SPRING_PROFILES_ACTIVE: test
        run: |
          set -o pipefail
          mvn -B -e -DtrimStackTrace=false clean verify 2>&1 | tee maven-test.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-backend-test-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: |
            maven-test.log
            target/surefire-reports/**
            target/failsafe-reports/**
            target/site/jacoco/**
            target/*.exec
