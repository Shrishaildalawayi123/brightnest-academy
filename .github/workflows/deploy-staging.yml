name: Deploy Staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  deploy-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop' }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout workflow head SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/brightnest-academy:staging-${{ github.event.workflow_run.head_sha }}

      - name: Deploy to staging EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_STAGING_HOST }}
          username: ${{ secrets.EC2_STAGING_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          envs: GITHUB_REPOSITORY_OWNER,GITHUB_SHA,GITHUB_TOKEN
          script: |
            set -euo pipefail
            IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/brightnest-academy:staging-${GITHUB_SHA}"
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_REPOSITORY_OWNER}" --password-stdin
            docker pull "${IMAGE}"
            docker rm -f brightnest-staging || true
            docker run -d \
              --name brightnest-staging \
              --env-file /opt/brightnest/.env \
              -e SPRING_PROFILES_ACTIVE=prod \
              -p 127.0.0.1:8080:8080 \
              --restart unless-stopped \
              "${IMAGE}"

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
                echo "Staging health check passed"
                exit 0
              fi
              sleep 10
            done
            echo "Staging health check failed"
            exit 1
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: qa/package-lock.json

      - name: Install QA dependencies
        run: npm ci --prefix qa

      - name: Install Playwright browser
        run: npx --prefix qa playwright install --with-deps chromium

      - name: Run Playwright E2E against staging
        id: e2e
        continue-on-error: true
        run: npm run --prefix qa test:e2e
        env:
          E2E_BASE_URL: http://${{ secrets.EC2_STAGING_HOST }}

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 smoke test against staging
        id: k6
        continue-on-error: true
        run: k6 run -e BASE_URL=http://${{ secrets.EC2_STAGING_HOST }} performance/k6/smoke.js

      - name: Build staging summary
        id: summary
        run: |
          {
            echo "### Staging Deployment Result"
            echo "- Commit: ${{ github.event.workflow_run.head_sha }}"
            echo "- E2E status: ${{ steps.e2e.outcome }}"
            echo "- k6 status: ${{ steps.k6.outcome }}"
            echo "- URL: http://${{ secrets.EC2_STAGING_HOST }}"
          } > staging-summary.md

      - name: Upload staging summary
        uses: actions/upload-artifact@v4
        with:
          name: staging-summary-${{ github.event.workflow_run.head_sha }}
          path: staging-summary.md

      - name: Comment on related PR (if exists)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.payload.workflow_run.head_branch;
            const prs = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${branch}` });
            if (prs.data.length === 0) {
              core.info('No open PR found for branch, skipping PR comment.');
              return;
            }
            const body = [
              '### Staging Deployment Result',
              `- Commit: ${context.payload.workflow_run.head_sha}`,
              `- E2E status: ${{ steps.e2e.outcome }}`,
              `- k6 status: ${{ steps.k6.outcome }}`,
              `- URL: http://${{ secrets.EC2_STAGING_HOST }}`
            ].join('\n');
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prs.data[0].number,
              body
            });

      - name: Fail when staging quality checks fail
        if: ${{ steps.e2e.outcome != 'success' || steps.k6.outcome != 'success' }}
        run: |
          echo "Staging checks failed."
          exit 1

