<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Sessions - BrightNest Academy</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <a href="/">BrightNest Academy</a>
            </div>
            <div class="navbar-menu">
                <a href="/teacher-dashboard.html">Dashboard</a>
                <a href="/manage-schedules.html">Schedules</a>
                <a href="/manage-sessions.html" class="active">Sessions</a>
                <a href="/manage-assignments.html">Assignments</a>
                <a href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container main-content">
        <div class="page-header">
            <h1>Class Sessions</h1>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="upcoming">Upcoming Sessions</button>
            <button class="tab-btn" data-tab="needsAttendance">Needs Attendance</button>
        </div>

        <!-- Upcoming Sessions Tab -->
        <div id="upcoming" class="tab-content active">
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table" id="upcomingTable">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Course</th>
                                    <th>Teacher</th>
                                    <th>Time</th>
                                    <th>Room</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="upcomingBody">
                                <tr><td colspan="7" class="text-center">Loading sessions...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Needs Attendance Tab -->
        <div id="needsAttendance" class="tab-content">
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table" id="needsAttendanceTable">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Course</th>
                                    <th>Teacher</th>
                                    <th>Time</th>
                                    <th>Room</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="needsAttendanceBody">
                                <tr><td colspan="6" class="text-center">Loading sessions...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Attendance Modal -->
    <div id="attendanceModal" class="modal" style="display: none;">
        <div class="modal-content large">
            <div class="modal-header">
                <h2 id="attendanceModalTitle">Mark Attendance</h2>
                <span class="close" onclick="closeAttendanceModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div id="sessionInfo" class="mb-4"></div>
                <form id="attendanceForm">
                    <input type="hidden" id="sessionId">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Student</th>
                                <th>Status</th>
                                <th>Check-in Time</th>
                                <th>Notes</th>
                            </tr>
                        </thead>
                        <tbody id="studentsBody">
                        </tbody>
                    </table>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="closeAttendanceModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Attendance</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { apiCall, showNotification, formatDate, formatTime } from '/js/app.js';

        let upcomingSessions = [];
        let attendanceSessions = [];

        // Load data
        async function loadData() {
            try {
                upcomingSessions = await apiCall('/api/v1/sessions/upcoming');
                attendanceSessions = await apiCall('/api/v1/sessions/needs-attendance');
                renderUpcoming();
                renderNeedsAttendance();
            } catch (error) {
                showNotification('Failed to load sessions: ' + error.message, 'error');
            }
        }

        // Render upcoming sessions
        function renderUpcoming() {
            const tbody = document.getElementById('upcomingBody');
            
            if (upcomingSessions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center">No upcoming sessions</td></tr>';
                return;
            }
            
            tbody.innerHTML = upcomingSessions.map(session => `
                <tr>
                    <td>${formatDate(session.sessionDate)}</td>
                    <td>${session.courseName}</td>
                    <td>${session.teacherName}</td>
                    <td>${formatTime(session.scheduledStartTime)} - ${formatTime(session.scheduledEndTime)}</td>
                    <td>${session.roomNumber}</td>
                    <td>
                        <span class="badge badge-${getStatusColor(session.status)}">
                            ${session.status}
                        </span>
                    </td>
                    <td>
                        ${session.status === 'SCHEDULED' ? 
                            `<button class="btn btn-sm btn-success" onclick="startSession(${session.id})">Start</button>` :
                            ''
                        }
                        ${session.status === 'IN_PROGRESS' ? 
                            `<button class="btn btn-sm btn-primary" onclick="completeSession(${session.id})">Complete</button>` :
                            ''
                        }
                        <button class="btn btn-sm btn-danger" onclick="cancelSession(${session.id})">Cancel</button>
                    </td>
                </tr>
            `).join('');
        }

        // Render sessions needing attendance
        function renderNeedsAttendance() {
            const tbody = document.getElementById('needsAttendanceBody');
            
            if (attendanceSessions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center">No sessions need attendance marking</td></tr>';
                return;
            }
            
            tbody.innerHTML = attendanceSessions.map(session => `
                <tr>
                    <td>${formatDate(session.sessionDate)}</td>
                    <td>${session.courseName}</td>
                    <td>${session.teacherName}</td>
                    <td>${formatTime(session.scheduledStartTime)} - ${formatTime(session.scheduledEndTime)}</td>
                    <td>${session.roomNumber}</td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="markAttendance(${session.id}, '${session.courseName}', '${session.sessionDate}')">
                            Mark Attendance
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Start session
        window.startSession = async function(id) {
            if (!confirm('Start this session?')) return;
            
            try {
                await apiCall(`/api/v1/sessions/${id}/start`, 'POST');
                showNotification('Session started successfully', 'success');
                loadData();
            } catch (error) {
                showNotification('Failed to start session: ' + error.message, 'error');
            }
        };

        // Complete session
        window.completeSession = async function(id) {
            if (!confirm('Mark session as completed?')) return;
            
            try {
                await apiCall(`/api/v1/sessions/${id}/complete`, 'POST');
                showNotification('Session completed successfully', 'success');
                loadData();
            } catch (error) {
                showNotification('Failed to complete session: ' + error.message, 'error');
            }
        };

        // Cancel session
        window.cancelSession = async function(id) {
            const reason = prompt('Enter cancellation reason:');
            if (!reason) return;
            
            try {
                await apiCall(`/api/v1/sessions/${id}/cancel`, 'POST', reason);
                showNotification('Session cancelled', 'success');
                loadData();
            } catch (error) {
                showNotification('Failed to cancel session: ' + error.message, 'error');
            }
        };

        // Mark attendance
        window.markAttendance = async function(sessionId, courseName, sessionDate) {
            try {
                // Get enrolled students for the course
                const session = upcomingSessions.find(s => s.id === sessionId) || 
                               attendanceSessions.find(s => s.id === sessionId);
                const courseId = session.scheduleId; // We'll need to get this properly
                
                // For demo, load all students - in production, load enrolled students
                const students = await apiCall('/api/users?role=STUDENT');
                
                // Get existing attendance
                const existingAttendance = await apiCall(`/api/v1/session-attendance/session/${sessionId}`).catch(() => []);
                
                document.getElementById('sessionId').value = sessionId;
                document.getElementById('attendanceModalTitle').textContent = `Mark Attendance - ${courseName}`;
                document.getElementById('sessionInfo').innerHTML = `
                    <p><strong>Course:</strong> ${courseName}</p>
                    <p><strong>Date:</strong> ${formatDate(sessionDate)}</p>
                `;
                
                const tbody = document.getElementById('studentsBody');
                tbody.innerHTML = students.map(student => {
                    const existing = existingAttendance.find(a => a.studentId === student.id);
                    return `
                        <tr>
                            <td>
                                ${student.fullName}
                                <input type="hidden" class="studentId" value="${student.id}">
                            </td>
                            <td>
                                <select class="form-control attendance-status">
                                    <option value="PRESENT" ${existing?.status === 'PRESENT' ? 'selected' : ''}>Present</option>
                                    <option value="ABSENT" ${existing?.status === 'ABSENT' ? 'selected' : ''}>Absent</option>
                                    <option value="LATE" ${existing?.status === 'LATE' ? 'selected' : ''}>Late</option>
                                    <option value="EXCUSED" ${existing?.status === 'EXCUSED' ? 'selected' : ''}>Excused</option>
                                </select>
                            </td>
                            <td>
                                <input type="time" class="form-control check-in-time" value="${existing?.checkInTime || ''}">
                            </td>
                            <td>
                                <input type="text" class="form-control attendance-notes" placeholder="Optional notes" value="${existing?.notes || ''}">
                            </td>
                        </tr>
                    `;
                }).join('');
                
                document.getElementById('attendanceModal').style.display = 'flex';
            } catch (error) {
                showNotification('Failed to load attendance data: ' + error.message, 'error');
            }
        };

        // Close attendance modal
        window.closeAttendanceModal = function() {
            document.getElementById('attendanceModal').style.display = 'none';
        };

        // Submit attendance
        document.getElementById('attendanceForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const sessionId = parseInt(document.getElementById('sessionId').value);
            const rows = document.querySelectorAll('#studentsBody tr');
            
            const attendanceData = Array.from(rows).map(row => ({
                sessionId: sessionId,
                studentId: parseInt(row.querySelector('.studentId').value),
                status: row.querySelector('.attendance-status').value,
                checkInTime: row.querySelector('.check-in-time').value || null,
                notes: row.querySelector('.attendance-notes').value || null
            }));
            
            try {
                await apiCall('/api/v1/session-attendance/mark', 'POST', attendanceData);
                showNotification('Attendance marked successfully', 'success');
                closeAttendanceModal();
                loadData();
            } catch (error) {
                showNotification('Failed to save attendance: ' + error.message, 'error');
            }
        });

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const tabName = this.dataset.tab;
                
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                this.classList.add('active');
                document.getElementById(tabName).classList.add('active');
            });
        });

        // Helper function
        function getStatusColor(status) {
            switch(status) {
                case 'SCHEDULED': return 'primary';
                case 'IN_PROGRESS': return 'warning';
                case 'COMPLETED': return 'success';
                case 'CANCELLED': return 'danger';
                default: return 'secondary';
            }
        }

        // Initialize
        loadData();
    </script>
</body>
</html>
