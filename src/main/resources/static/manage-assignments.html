<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments - BrightNest Academy</title>
    <meta name="description" content="Teacher dashboard page for managing assignments at BrightNest Academy.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://brightnest-academy.com/manage-assignments.html">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <a href="/">BrightNest Academy</a>
            </div>
            <div class="navbar-menu">
                <a href="/teacher-dashboard.html">Dashboard</a>
                <a href="/manage-schedules.html">Schedules</a>
                <a href="/manage-sessions.html">Sessions</a>
                <a href="/manage-assignments.html" class="active">Assignments</a>
                <a href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container main-content">
        <div class="page-header">
            <h1>Assignments</h1>
            <button id="addAssignmentBtn" class="btn btn-primary">+ Create Assignment</button>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="all">All Assignments</button>
            <button class="tab-btn" data-tab="upcoming">Upcoming</button>
            <button class="tab-btn" data-tab="ungraded">Pending Grading</button>
        </div>

        <!-- All Assignments Tab -->
        <div id="all" class="tab-content active">
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Course</th>
                                    <th>Due Date</th>
                                    <th>Max Score</th>
                                    <th>Submissions</th>
                                    <th>Avg Score</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="allAssignmentsBody">
                                <tr><td colspan="8" class="text-center">Loading assignments...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Upcoming Tab -->
        <div id="upcoming" class="tab-content">
            <div class="card">
                <div class="card-body">
                    <div id="upcomingAssignments">Loading...</div>
                </div>
            </div>
        </div>

        <!-- Ungraded Tab -->
        <div id="ungraded" class="tab-content">
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Assignment</th>
                                    <th>Student</th>
                                    <th>Submitted</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="ungradedSubmissionsBody">
                                <tr><td colspan="5" class="text-center">Loading submissions...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Assignment Modal -->
    <div id="assignmentModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="assignmentModalTitle">Create Assignment</h2>
                <span class="close" onclick="closeAssignmentModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="assignmentForm">
                    <input type="hidden" id="assignmentId">
                    
                    <div class="form-group">
                        <label for="courseId">Course *</label>
                        <select id="courseId" class="form-control" required>
                            <option value="">Select Course</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="title">Title *</label>
                        <input type="text" id="title" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="description">Description *</label>
                        <textarea id="description" class="form-control" rows="4" required></textarea>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="dueDate">Due Date *</label>
                            <input type="datetime-local" id="dueDate" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="maxScore">Max Score *</label>
                            <input type="number" id="maxScore" class="form-control" min="1" max="1000" value="100" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="attachmentUrl">Attachment URL (optional)</label>
                        <input type="url" id="attachmentUrl" class="form-control">
                    </div>
                    
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="closeAssignmentModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Assignment</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Grading Modal -->
    <div id="gradingModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Grade Submission</h2>
                <span class="close" onclick="closeGradingModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div id="submissionInfo" class="mb-4"></div>
                <form id="gradingForm">
                    <input type="hidden" id="submissionId">
                    
                    <div class="form-group">
                        <label for="score">Score *</label>
                        <input type="number" id="score" class="form-control" min="0" required>
                        <small id="maxScoreHint" class="form-text"></small>
                    </div>
                    
                    <div class="form-group">
                        <label for="feedback">Feedback *</label>
                        <textarea id="feedback" class="form-control" rows="4" required></textarea>
                    </div>
                    
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="closeGradingModal()">Cancel</button>
                        <button type="submit" class="btn btn-success">Submit Grade</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { apiCall, showNotification, formatDate, getCurrentUser } from '/js/app.js';

        let allAssignments = [];
        let ungradedSubmissions = [];
        let courses = [];
        let currentUser = null;

        // Load data
        async function loadData() {
            try {
                currentUser = await getCurrentUser();
                courses = await apiCall('/api/courses');
                populateCourseSelect();
                
                allAssignments = await apiCall('/api/v1/assignments');
                renderAllAssignments();
                renderUpcoming();
                
                ungradedSubmissions = await apiCall('/api/v1/submissions/ungraded');
                renderUngraded();
            } catch (error) {
                showNotification('Failed to load data: ' + error.message, 'error');
            }
        }

        // Populate course select
        function populateCourseSelect() {
            const select = document.getElementById('courseId');
            courses.forEach(course => {
                const option = document.createElement('option');
                option.value = course.id;
                option.textContent = course.name;
                select.appendChild(option);
            });
        }

        // Render all assignments
        function renderAllAssignments() {
            const tbody = document.getElementById('allAssignmentsBody');
            
            if (allAssignments.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center">No assignments found</td></tr>';
                return;
            }
            
            tbody.innerHTML = allAssignments.map(assignment => `
                <tr>
                    <td>${assignment.title}</td>
                    <td>${assignment.courseName}</td>
                    <td>${formatDate(assignment.dueDate)}</td>
                    <td>${assignment.maxScore}</td>
                    <td>${assignment.totalSubmissions || 0} / ${assignment.gradedSubmissions || 0} graded</td>
                    <td>${assignment.averageScore ? assignment.averageScore.toFixed(1) : 'N/A'}</td>
                    <td>
                        <span class="badge ${assignment.isPublished ? 'badge-success' : 'badge-secondary'}">
                            ${assignment.isPublished ? 'Published' : 'Draft'}
                        </span>
                        ${assignment.isOverdue ? '<span class="badge badge-danger">Overdue</span>' : ''}
                    </td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="editAssignment(${assignment.id})">Edit</button>
                        ${!assignment.isPublished ? 
                            `<button class="btn btn-sm btn-success" onclick="publishAssignment(${assignment.id})">Publish</button>` :
                            `<button class="btn btn-sm btn-warning" onclick="unpublishAssignment(${assignment.id})">Unpublish</button>`
                        }
                        <button class="btn btn-sm btn-info" onclick="viewSubmissions(${assignment.id})">Submissions</button>
                    </td>
                </tr>
            `).join('');
        }

        // Render upcoming assignments
        function renderUpcoming() {
            const upcomingAssignments = allAssignments.filter(a => !a.isOverdue && a.isPublished);
            const container = document.getElementById('upcomingAssignments');
            
            if (upcomingAssignments.length === 0) {
                container.innerHTML = '<p class="text-center">No upcoming assignments</p>';
                return;
            }
            
            container.innerHTML = upcomingAssignments.map(assignment => `
                <div class="card mb-3">
                    <div class="card-body">
                        <h3>${assignment.title}</h3>
                        <p><strong>Course:</strong> ${assignment.courseName}</p>
                        <p><strong>Due:</strong> ${formatDate(assignment.dueDate)}</p>
                        <p><strong>Score:</strong> ${assignment.maxScore} points</p>
                        <p>${assignment.description}</p>
                        ${assignment.attachmentUrl ? `<p><a href="${assignment.attachmentUrl}" target="_blank">View Attachment</a></p>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // Render ungraded submissions
        function renderUngraded() {
            const tbody = document.getElementById('ungradedSubmissionsBody');
            
            if (ungradedSubmissions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center">No pending submissions</td></tr>';
                return;
            }
            
            tbody.innerHTML = ungradedSubmissions.map(submission => `
                <tr>
                    <td>${submission.assignmentTitle}</td>
                    <td>${submission.studentName}</td>
                    <td>${formatDate(submission.submittedAt)}</td>
                    <td>
                        ${submission.isLate ? '<span class="badge badge-warning">Late</span>' : '<span class="badge badge-success">On Time</span>'}
                    </td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="gradeSubmission(${submission.id}, '${submission.assignmentTitle}', '${submission.studentName}', '${submission.submissionText}', ${submission.maxScore})">
                            Grade
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Modal functions
        window.addAssignmentBtn.onclick = function() {
            document.getElementById('assignmentModalTitle').textContent = 'Create Assignment';
            document.getElementById('assignmentForm').reset();
            document.getElementById('assignmentId').value = '';
            document.getElementById('assignmentModal').style.display = 'flex';
        };

        window.editAssignment = async function(id) {
            try {
                const assignment = await apiCall(`/api/v1/assignments/${id}`);
                
                document.getElementById('assignmentModalTitle').textContent = 'Edit Assignment';
                document.getElementById('assignmentId').value = assignment.id;
                document.getElementById('courseId').value = assignment.courseId;
                document.getElementById('title').value = assignment.title;
                document.getElementById('description').value = assignment.description;
                document.getElementById('dueDate').value = assignment.dueDate;
                document.getElementById('maxScore').value = assignment.maxScore;
                document.getElementById('attachmentUrl').value = assignment.attachmentUrl || '';
                document.getElementById('assignmentModal').style.display = 'flex';
            } catch (error) {
                showNotification('Failed to load assignment: ' + error.message, 'error');
            }
        };

        window.publishAssignment = async function(id) {
            try {
                await apiCall(`/api/v1/assignments/${id}/publish`, 'POST');
                showNotification('Assignment published successfully', 'success');
                loadData();
            } catch (error) {
                showNotification('Failed to publish assignment: ' + error.message, 'error');
            }
        };

        window.unpublishAssignment = async function(id) {
            try {
                await apiCall(`/api/v1/assignments/${id}/unpublish`, 'POST');
                showNotification('Assignment unpublished', 'success');
                loadData();
            } catch (error) {
                showNotification('Failed to unpublish assignment: ' + error.message, 'error');
            }
        };

        window.gradeSubmission = function(id, assignmentTitle, studentName, submissionText, maxScore) {
            document.getElementById('submissionId').value = id;
            document.getElementById('maxScoreHint').textContent = `Maximum score: ${maxScore}`;
            document.getElementById('score').max = maxScore;
            
            document.getElementById('submissionInfo').innerHTML = `
                <p><strong>Assignment:</strong> ${assignmentTitle}</p>
                <p><strong>Student:</strong> ${studentName}</p>
                <p><strong>Submission:</strong></p>
                <div class="alert alert-info">${submissionText}</div>
            `;
            
            document.getElementById('gradingModal').style.display = 'flex';
        };

        window.closeAssignmentModal = function() {
            document.getElementById('assignmentModal').style.display = 'none';
        };

        window.closeGradingModal = function() {
            document.getElementById('gradingModal').style.display = 'none';
        };

        // Submit assignment form
        document.getElementById('assignmentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const assignmentId = document.getElementById('assignmentId').value;
            const formData = {
                courseId: parseInt(document.getElementById('courseId').value),
                teacherId: currentUser.id,
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                dueDate: document.getElementById('dueDate').value,
                maxScore: parseInt(document.getElementById('maxScore').value),
                attachmentUrl: document.getElementById('attachmentUrl').value || null,
                isPublished: false
            };
            
            try {
                if (assignmentId) {
                    await apiCall(`/api/v1/assignments/${assignmentId}`, 'PUT', formData);
                    showNotification('Assignment updated successfully', 'success');
                } else {
                    await apiCall('/api/v1/assignments', 'POST', formData);
                    showNotification('Assignment created successfully', 'success');
                }
                
                closeAssignmentModal();
                loadData();
            } catch (error) {
                showNotification('Failed to save assignment: ' + error.message, 'error');
            }
        });

        // Submit grading form
        document.getElementById('gradingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submissionId = document.getElementById('submissionId').value;
            const gradeData = {
                score: parseInt(document.getElementById('score').value),
                feedback: document.getElementById('feedback').value
            };
            
            try {
                await apiCall(`/api/v1/submissions/${submissionId}/grade`, 'POST', gradeData);
                showNotification('Submission graded successfully', 'success');
                closeGradingModal();
                loadData();
            } catch (error) {
                showNotification('Failed to grade submission: ' + error.message, 'error');
            }
        });

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const tabName = this.dataset.tab;
                
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                this.classList.add('active');
                document.getElementById(tabName).classList.add('active');
            });
        });

        // Initialize
        loadData();
    </script>
</body>
</html>
