# ========================================
# Load Testing Profile Configuration
# Uses H2 in-memory database for fast startup
# ========================================

# H2 In-Memory Database (no MySQL required)
spring.datasource.url=jdbc:h2:mem:loadtest;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable SQL init scripts (we'll bootstrap via code)
spring.sql.init.mode=never

# Security - Disable HTTPS requirement for load testing
https.required=false

# Admin Bootstrap (create test admin user)
admin.email=admin@loadtest.com
admin.password=LoadTest123!

# JWT Configuration (fixed secret for consistent testing)
jwt.secret=loadtestsecretkey12345678901234567890123456789012345678901234567890
jwt.expiration=3600000
jwt.refresh.expiration=604800000
jwt.refresh.pepper=loadtestpepper123

# Authentication Settings
auth.require-email-verification=false
auth.lockout.max-attempts=10
auth.lockout.duration-minutes=5
auth.verification.expiry-hours=24

# Rate Limiting (in-memory, relaxed for load testing)
rate.limit.backend=inmemory
rate.limit.login.max=10000
rate.limit.login.window-seconds=60
rate.limit.api.max=10000
rate.limit.api.window-seconds=60

# Security Cookie Settings
security.cookie.secure=false
security.cookie.same-site=Lax

# Actuator/Monitoring (enable for load test metrics)
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Server Settings (optimize for load testing)
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
server.compression.enabled=true
server.compression.min-response-size=1024

# Redis (disable for load testing - use in-memory cache)
spring.cache.type=simple

# Logging (reduce noise during load tests)
logging.level.root=WARN
logging.level.com.shrishailacademy=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
