# =============================================
# Production Profile - BrightNest Academy
# Activate via: SPRING_PROFILES_ACTIVE=prod
# All values MUST come from environment variables
# =============================================

# Database: enforce SSL in production
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:brightnest}?useSSL=true&requireSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=false
spring.datasource.username=${DB_USER:brightnest}
spring.datasource.password=${DB_PASS:}

# Hibernate: NEVER auto-modify schema in production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Logging: minimal in production
logging.level.root=WARN
logging.level.com.shrishailacademy=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Connection pool: tuned for production
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:15}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# Actuator: only health and info, no sensitive endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.env.enabled=false
management.endpoint.beans.enabled=false
management.endpoint.configprops.enabled=false
management.endpoint.mappings.enabled=false

# Disable Springdoc/Swagger in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Server: disable error details
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.forward-headers-strategy=framework
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:200}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}
server.tomcat.connection-timeout=${TOMCAT_CONNECTION_TIMEOUT:20s}
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
server.tomcat.accesslog.enabled=false

# HTTPS redirect (Render/Cloudflare terminates SSL)
https.required=true

# CORS: restrict in production (override via CORS_ORIGINS)
# Include Amplify domain(s) when deploying frontend to AWS Amplify.
# Example: CORS_ORIGINS=https://brightnest-academy.com,https://www.brightnest-academy.com,https://main.XXXX.amplifyapp.com
cors.allowed.origins=${CORS_ORIGINS:https://brightnest-academy.com,https://www.brightnest-academy.com}

# Secure cookies in production
security.cookie.secure=true
security.cookie.same-site=None

# JWT: 1-hour token expiry (override via JWT_EXPIRATION env var)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh.pepper=${JWT_REFRESH_PEPPER:}
auth.lockout.max-attempts=${AUTH_LOCKOUT_MAX_ATTEMPTS:5}
auth.lockout.duration-minutes=${AUTH_LOCKOUT_DURATION_MINUTES:30}
auth.verification.expiry-hours=${AUTH_VERIFICATION_EXPIRY_HOURS:24}
rate.limit.backend=${RATE_LIMIT_BACKEND:redis}
rate.limit.trust-forward-headers=true

# Redis (optional; enable by providing env vars)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:5000}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2000}

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=2000,expireAfterWrite=10m

audit.trust-forward-headers=true
